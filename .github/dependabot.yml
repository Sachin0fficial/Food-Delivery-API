version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/food-delivery-api-main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
      testing:
        patterns:
          - "org.springframework.boot:spring-boot-starter-test"
          - "org.junit*:*"
          - "org.mockito:*"
      monitoring:
        patterns:
          - "io.micrometer:*"
          - "net.logstash.logback:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    directory: "/food-delivery-api-main"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
