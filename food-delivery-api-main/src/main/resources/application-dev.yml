spring:
  datasource:
    url: jdbc:h2:mem:food_delivery_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.codestorykh: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true

app:
  upload:
    dir: ./dev-uploads
  gemini:
    api-key: ${GEMINI_API_KEY:dev-placeholder}
